<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lantern God Iterations</title>
  <style>
    body { margin: 0; background: #0e0f13; color: #ece7df; font-family: Georgia, serif; }
    .wrap { max-width: 1300px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 18px; color: #c6beb1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    figure { margin: 0; background: #171a1f; border: 1px solid #2c313b; border-radius: 10px; overflow: hidden; }
    img { width: 100%; display: block; background: #0e0f13; }
    figcaption { padding: 10px 12px; font-size: 14px; color: #d8cfbf; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Lantern God - Rough Visual Iterations</h1>
    <p>Fast silhouette/expression passes for companion concept exploration.</p>
    <div class="grid">
      <figure>
        <img src="iteration_1_reliquary_lantern.svg" alt="Iteration 1" />
        <figcaption>1. Reliquary Lantern</figcaption>
      </figure>
      <figure>
        <img src="iteration_2_broken_halo.svg" alt="Iteration 2" />
        <figcaption>2. Broken Halo Frame</figcaption>
      </figure>
      <figure>
        <img src="iteration_3_tall_shrine.svg" alt="Iteration 3" />
        <figcaption>3. Tall Shrine Lantern</figcaption>
      </figure>
      <figure>
        <img src="iteration_4_chained_censer.svg" alt="Iteration 4" />
        <figcaption>4. Chained Censer Lantern</figcaption>
      </figure>
      <figure>
        <img src="iteration_5_split_face_flare.svg" alt="Iteration 5" />
        <figcaption>5. Split Face Flare Lantern</figcaption>
      </figure>
    </div>
  </div>
</body>
</html>
